<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar AI - Buku Teks Interaktif</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0a1f1a 0%, #0f2a23 50%, #12362e 100%); color: #fff; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; min-height: 100vh; padding: 0 0 20px; }
        .header { text-align: center; padding: 20px 15px 10px; }
        .header h1 { font-size: 22px; font-weight: 900; color: #4ade80; text-shadow: 0 0 30px rgba(74, 222, 128, 0.5); }
        .header p { color: #a0aec0; font-size: 11px; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; padding: 0 15px; margin-bottom: 15px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .tab-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-weight: 800; font-size: 12px; background: rgba(255,255,255,0.08); color: #fff; transition: all 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #4ade80, #22c55e); color: #0a1f1a; }
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .section-label { font-size: 11px; color: #86efac; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin: 15px 0 10px; }
        .tahap-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
        .tahap-btn { padding: 10px 4px; border-radius: 8px; border: 2px solid rgba(74, 222, 128, 0.2); font-size: 10px; font-weight: 800; cursor: pointer; background: rgba(74, 222, 128, 0.05); color: #fff; }
        .tahap-btn.active { border-color: #4ade80; background: rgba(74, 222, 128, 0.2); }
        .subjek-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 15px; max-height: 200px; overflow-y: auto; padding-right: 5px; }
        .subjek-btn { padding: 10px; border-radius: 8px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; background: rgba(255, 255, 255, 0.06); color: #fff; text-align: left; }
        .subjek-btn.active { background: linear-gradient(135deg, #059669, #047857); border: 1px solid #4ade80; }
        .content-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(74, 222, 128, 0.15); border-radius: 20px; padding: 20px; margin-bottom: 15px; min-height: 250px; }
        
        /* Gaya Buku Teks */
        .buku-teks h2 { font-size: 18px; color: #4ade80; margin-bottom: 15px; border-bottom: 1px solid rgba(74,222,128,0.3); padding-bottom: 10px; }
        .buku-teks p { font-size: 14px; line-height: 1.8; color: #cbd5e1; margin-bottom: 15px; text-align: justify; }
        .latihan-box { margin-top: 25px; padding: 15px; background: rgba(74, 222, 128, 0.08); border-radius: 12px; border-left: 3px solid #fbbf24; }
        .latihan-box h3 { font-size: 14px; color: #fbbf24; margin-bottom: 10px; }
        
        .mcq-option { display: block; width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 2px solid rgba(74, 222, 128, 0.3); background: transparent; color: #fff; font-size: 13px; text-align: left; cursor: pointer; }
        .mcq-option.correct { background: #22c55e; color: #fff; border-color: #22c55e; }
        .mcq-option.wrong { background: #ef4444; color: #fff; border-color: #ef4444; }
        .mcq-option:disabled { cursor: not-allowed; }
        
        .chat-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(74, 222, 128, 0.15); border-radius: 20px; padding: 18px; margin-bottom: 15px; min-height: 200px; max-height: 350px; overflow-y: auto; }
        .msg { margin-bottom: 10px; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; }
        .msg.user { background: #059669; margin-left: 30px; text-align: right; }
        .msg.ai { background: rgba(255, 255, 255, 0.08); border-left: 3px solid #4ade80; }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .input-row input { flex: 1; padding: 14px; border-radius: 25px; border: 1px solid rgba(74, 222, 128, 0.2); background: rgba(255, 255, 255, 0.06); color: #fff; outline: none; font-size: 13px; }
        .btn-hantar { padding: 14px 20px; border-radius: 25px; border: none; background: #4ade80; color: #0a1f1a; font-weight: 900; cursor: pointer; }
        .btn-action { width: 100%; padding: 14px; border-radius: 12px; border: none; background: rgba(74, 222, 128, 0.15); color: #fff; font-weight: 700; cursor: pointer; margin-bottom: 10px; border: 1px solid rgba(74,222,128,0.3); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎓 Belajar AI</h1>
        <p>Buku Teks & Latihan Interaktif</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabBuku" onclick="switchTab('buku')">📖 Buku Teks</button>
        <button class="tab-btn" id="tabChat" onclick="switchTab('chat')">💬 Tanya AI</button>
    </div>

    <div class="container">
        <p class="section-label">📅 Pilih Tahap</p>
        <div class="tahap-grid" id="tahapGrid"></div>

        <p class="section-label">📚 Pilih Subjek</p>
        <div class="subjek-grid" id="subjekGrid"></div>

        <div id="viewBuku" class="content-box">
            <div style="text-align: center; color: #64748b; padding: 40px 0;">
                <p>Sila pilih subjek di atas, kemudian tekan butang di bawah untuk buka buku teks.</p>
                <button class="btn-action" onclick="bukaBukuTeks()" style="margin-top: 20px;">📖 BUKA BUKU TEKS</button>
            </div>
        </div>

        <div id="viewChat" class="hidden">
            <div class="chat-box" id="chatBox">
                <div class="msg ai">👋 Hai! Tanya apa-apa soalan tentang subjek yang dipilih.</div>
            </div>
            <div class="input-row">
                <input type="text" id="soalan" placeholder="Taip soalan..." onkeypress="if(event.key==='Enter') tanya()">
                <button class="btn-hantar" onclick="tanya()">Tanya</button>
            </div>
        </div>
    </div>

    <script>
        // SENARAI LENGKAP: TAHUN 1 - DIPLOMA
        const dataSemester = {
            // SEKOLAH RENDAH
            'Tahun 1': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Pendidikan Islam', 'Pendidikan Moral'],
            'Tahun 2': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Pendidikan Islam', 'Pendidikan Moral'],
            'Tahun 3': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Pendidikan Islam', 'Pendidikan Moral'],
            'Tahun 4': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Pendidikan Islam'],
            'Tahun 5': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Pendidikan Islam'],
            'Tahun 6': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Pendidikan Islam'],
            // SEKOLAH MENENGAH
            'Tingkatan 1': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Geografi', 'Pendidikan Islam'],
            'Tingkatan 2': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Geografi', 'Pendidikan Islam'],
            'Tingkatan 3': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Geografi', 'Pendidikan Islam'],
            'Tingkatan 4': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Fizik', 'Kimia', 'Biologi', 'Prinsip Akaun', 'Ekonomi'],
            'Tingkatan 5': ['Bahasa Melayu', 'English', 'Matematik', 'Sains', 'Sejarah', 'Fizik', 'Kimia', 'Biologi', 'Prinsip Akaun', 'Ekonomi'],
            // DIPLOMA UiTM IC120 (HALAL MANAGEMENT)
            'Part 1': ['CTU101: Fundamentals of Islam', 'ISC100: Aqidah Islamiyah', 'ISC102: Ulum Al-Quran', 'ISH101: Introduction to Halal Consumerism', 'LCC111: English I', 'MAT112: Business Mathematics'],
            'Part 2': ['CSC134: Computer and Info Processing', 'CTU152: Values and Civilization', 'ISC101: Akhlaq Islamiyah', 'ISC152: Ulum Al-Hadith', 'ISC200: Tarikh Tasyri\'', 'ISH150: Principle of Food Science'],
            'Part 3': ['CTU263: Islam and Management', 'IMU202: Islamic Economics', 'ISC151: Usul Fiqh', 'ISH202: Halal Business and Marketing', 'ISH203: Purification in Islam', 'LCC113: English III'],
            'Part 4': ['ENT300: Entrepreneurship', 'IMU102: Fiqh Muamalat', 'ISC201: Qawaid Fiqhiyah', 'ISH250: Fiqh Mu\'asarah', 'ISH252: Halal Standard and Certification', 'ISH253: Halal Logistics Management'],
            'Part 5': ['ISC251: Dirasah An-Nassiyah', 'ISH301: Halal Slaughtering', 'ISH304: Halal Regulatory and Governance', 'ISH305: Halal Quality and Assurance', 'ISH306: Industrial Training']
        };

        let tahapAktif = 'Part 3';
        let subjekAktif = 'ISH202: Halal Business and Marketing';
        let mcqData = null;

        function renderTahap() {
            const grid = document.getElementById('tahapGrid');
            grid.innerHTML = '';
            Object.keys(dataSemester).forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'tahap-btn' + (s === tahapAktif ? ' active' : '');
                btn.innerText = s;
                btn.onclick = () => { tahapAktif = s; subjekAktif = dataSemester[s][0]; renderTahap(); renderSubjek(); };
                grid.appendChild(btn);
            });
        }

        function renderSubjek() {
            const grid = document.getElementById('subjekGrid');
            grid.innerHTML = '';
            dataSemester[tahapAktif].forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'subjek-btn' + (s === subjekAktif ? ' active' : '');
                btn.innerText = s;
                btn.onclick = () => { subjekAktif = s; renderSubjek(); };
                grid.appendChild(btn);
            });
        }

        function switchTab(tab) {
            document.getElementById('tabBuku').classList.toggle('active', tab === 'buku');
            document.getElementById('tabChat').classList.toggle('active', tab === 'chat');
            document.getElementById('viewBuku').classList.toggle('hidden', tab !== 'buku');
            document.getElementById('viewChat').classList.toggle('hidden', tab !== 'chat');
        }

        async function bukaBukuTeks() {
            const box = document.getElementById('viewBuku');
            box.innerHTML = '<div style="text-align:center; padding: 40px; color: #4ade80;">⏳ Sedang menyediakan buku teks...</div>';
            
            try {
                const res = await fetch('/api/buku-teks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subjek: subjekAktif, tahap: tahapAktif })
                });
                const result = await res.json();
                
                if (result.status === 'success') {
                    const d = result.data;
                    mcqData = d.latihan;
                    
                    box.innerHTML = `
                        <div class="buku-teks">
                            <h2>${d.tajuk}</h2>
                            <p>${d.kandungan.replace(/\n/g, '<br><br>')}</p>
                            <div class="latihan-box">
                                <h3>✍️ LATIHAN</h3>
                                <p style="font-size: 14px; margin-bottom: 12px;">${d.latihan.soalan}</p>
                                <div id="mcqContainer">
                                    ${d.latihan.pilihan.map((p, i) => `
                                        <button class="mcq-option" onclick="jawabLatihan(${i}, this)">${p}</button>
                                    `).join('')}
                                </div>
                                <div id="feedback" style="margin-top: 10px; font-size: 13px; font-weight: bold;"></div>
                            </div>
                        </div>
                    `;
                } else {
                    box.innerHTML = '<div style="color: #ef4444; text-align: center;">❌ ' + (result.message || 'Gagal memuatkan buku teks.') + '</div>';
                }
            } catch (e) {
                box.innerHTML = '<div style="color: #ef4444; text-align: center;">❌ Ralat sambungan.</div>';
            }
        }

        function jawabLatihan(index, btn) {
            const semuaBtn = document.querySelectorAll('.mcq-option');
            semuaBtn.forEach(b => b.disabled = true);
            
            if (index === mcqData.jawapan_betul) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = '<span style="color:#22c55e;">✅ Betul! ' + mcqData.penjelasan + '</span>';
            } else {
                btn.classList.add('wrong');
                semuaBtn[mcqData.jawapan_betul].classList.add('correct');
                document.getElementById('feedback').innerHTML = '<span style="color:#ef4444;">❌ Salah. ' + mcqData.penjelasan + '</span>';
            }
        }

        async function tanya() {
            const input = document.getElementById('soalan');
            const soalan = input.value.trim();
            if (!soalan) return;
            const box = document.getElementById('chatBox');
            
            box.innerHTML += `<div class="msg user">${soalan}</div>`;
            input.value = '';
            box.innerHTML += `<div class="msg ai" id="loading">⏳ AI sedang berfikir...</div>`;
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch('/api/tanya', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ soalan, subjek: subjekAktif, tahap: tahapAktif })
                });
                const data = await res.json();
                document.getElementById('loading').remove();
                if (data.status === 'success') box.innerHTML += `<div class="msg ai">${data.jawapan}</div>`;
                else box.innerHTML += `<div class="msg ai">❌ Maaf, cuba lagi.</div>`;
            } catch (e) {
                document.getElementById('loading').remove();
                box.innerHTML += `<div class="msg ai">❌ Ralat sambungan.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        renderTahap();
        renderSubjek();
    </script>
</body>
</html>
