<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar AI - Premium VIP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020b1e;display:flex;justify-content:center;padding:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.app{width:100%;max-width:400px;background:linear-gradient(180deg,#0a1e3d 0%,#07162f 100%);border:3px solid #d4a017;border-radius:28px;padding:16px 12px 25px;box-shadow:0 0 30px rgba(212,160,23,0.3);min-height:100vh}
.crown{text-align:center;font-size:32px;margin-top:4px}
.badge-premium{display:flex;justify-content:center;margin:6px 0 8px}
.badge-premium span{background:linear-gradient(90deg,#d4a017,#f8d56b,#d4a017);color:#1a1200;font-weight:900;font-size:10px;letter-spacing:2px;padding:7px 16px;border-radius:20px}
.title{text-align:center;color:#f8d56b;font-weight:900;font-size:20px;letter-spacing:3px}
.subtitle{text-align:center;color:#d4a017;font-size:9px;letter-spacing:3px;margin:4px 0 14px}
.card{background:linear-gradient(135deg,rgba(15,40,80,0.9),rgba(7,22,47,0.9));border:2px solid #d4a017;border-radius:18px;padding:12px;margin-bottom:14px}
.vip-card{display:flex;align-items:center;gap:10px;position:relative}
.vip-avatar{width:55px;height:55px;border-radius:50%;border:2px solid #d4a017;object-fit:cover;box-shadow:0 0 12px rgba(212,160,23,0.5);flex-shrink:0}
.vip-info{flex:1}
.vip-label{color:#d4a017;font-size:8px;letter-spacing:2px;font-weight:800}
.vip-name{color:#fff;font-weight:900;font-size:18px;margin:2px 0}
.vip-member{background:linear-gradient(90deg,#8b4513,#cd7f32);color:#fff;font-size:9px;font-weight:800;padding:4px 10px;border-radius:10px;display:inline-block}
.btn-edit{width:38px;height:38px;background:#d4a017;border-radius:10px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-size:16px}
.section-title{text-align:center;color:#d4a017;font-size:10px;letter-spacing:2px;font-weight:900;margin-bottom:10px}
.tahun-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tahun-btn{padding:10px;border-radius:11px;border:1.5px solid #2a4a7a;background:rgba(10,30,61,0.6);color:#8da0c0;font-weight:800;font-size:11px;cursor:pointer}
.tahun-btn.active{background:#d4a017;color:#1a1200;border-color:#f8d56b;box-shadow:0 0 12px rgba(212,160,23,0.6)}
.kotak-label{text-align:center;color:#d4a017;font-size:10px;letter-spacing:2px;font-weight:900;margin:14px 0 10px}
.subjek-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subjek-box{background:rgba(10,30,61,0.7);border-radius:14px;padding:10px;text-align:center;cursor:pointer;min-height:85px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:0.2s}
.subjek-box.biru{border:1.5px solid #3b82f6}
.subjek-box.pink{border:1.5px solid #ec4899}
.subjek-box.kuning{border:1.5px solid #d4a017}
.subjek-box.hijau{border:1.5px solid #10b981}
.subjek-box.active{box-shadow:0 0 15px currentColor;transform:scale(1.03)}
.subjek-icon{font-size:24px;margin-bottom:4px}
.subjek-nama{font-size:10px;font-weight:800;color:#fff}
.subjek-desc{font-size:7px;color:#64748b;margin-top:2px}
.content-view{margin-top:12px;background:rgba(0,0,0,0.3);border:1px solid #1e3a5f;border-radius:14px;padding:14px;min-height:180px;color:#cbd5e1;font-size:12px;line-height:1.6}
.hidden{display:none}
.tabs{display:flex;gap:6px;margin-top:12px}
.tab-btn{flex:1;padding:10px;border-radius:12px;border:1.5px solid #2a4a7a;background:rgba(10,30,61,0.6);color:#8da0c0;font-weight:800;font-size:11px;cursor:pointer}
.tab-btn.active{background:#d4a017;color:#1a1200;border-color:#f8d56b}
.input-row{display:flex;gap:6px;margin-top:10px}
.input-row input{flex:1;padding:11px 14px;border-radius:18px;border:1px solid #2a4a7a;background:#0a1e3d;color:#fff;outline:none;font-size:11px}
.btn-tanya{padding:11px 16px;border-radius:18px;border:none;background:#d4a017;color:#1a1200;font-weight:900;cursor:pointer;font-size:11px}
.msg{padding:9px 12px;border-radius:11px;margin-bottom:7px;font-size:11px}
.msg.ai{background:rgba(212,160,23,0.1);border-left:2px solid #d4a017}
.msg.user{background:#d4a017;color:#1a1200;text-align:right;margin-left:25px}
</style>
</head>
<body>
<div class="app">
  <div class="crown">👑</div>
  <div class="badge-premium"><span>💎 EDISI PREMIUM VIP</span></div>
  <div class="title">BELAJAR AI</div>
  <div class="subtitle">✦ DIPLOMA HALAL — SEM 1-5 ✦</div>

  <div class="card vip-card">
    <img src="logo.png" class="vip-avatar" alt="logo">
    <div class="vip-info">
      <div class="vip-label">👑 AHLI VIP</div>
      <div class="vip-name" id="namaVIP">Pelajar Halal</div>
      <div class="vip-member">💎 BRONZE MEMBER</div>
    </div>
    <button class="btn-edit" onclick="editNama()">✏️</button>
  </div>

  <div class="card">
    <div class="section-title">📅 PILIH SEMESTER ANDA</div>
    <div class="tahun-grid" id="tahapGrid"></div>
  </div>

  <div class="kotak-label">👇 KLIK KOTAK SUBJEK 👇</div>
  <div class="subjek-grid" id="subjekGrid"></div>

  <div class="tabs">
    <button class="tab-btn active" id="btnBuku" onclick="showTab('buku')">📚 BUKU TEKS</button>
    <button class="tab-btn" id="btnChat" onclick="showTab('chat')">💬 TANYA AI</button>
  </div>

  <div id="viewBuku" class="content-view">Pilih subjek untuk buka buku teks...</div>

  <div id="viewChat" class="content-view hidden">
    <div id="chatBox"><div class="msg ai">👋 Assalamualaikum! Saya AI Tutor Halal. Tanya apa saja tentang subjek <b id="subjekChat">-</b></div></div>
    <div class="input-row">
      <input type="text" id="soalan" placeholder="Taip soalan..." onkeypress="if(event.key==='Enter') tanya()">
      <button class="btn-tanya" onclick="tanya()">TANYA</button>
    </div>
  </div>
</div>

<script>
const dataSemester={
'Sem 1':['CTU101','ISC100','ISC102','ISH101','LCC111','MAT112'],
'Sem 2':['CSC134','CTU152','ISC101','ISC152','ISC200','ISH150'],
'Sem 3':['CTU263','IMU202','ISC151','ISH202','ISH203','LCC113'],
'Sem 4':['ENT300','IMU102','ISC201','ISH250','ISH252','ISH253'],
'Sem 5':['ISC251','ISH301','ISH304','ISH305','ISH306']
};
const subjekFull={
'CTU101':'Fundamentals of Islam','ISC100':'Aqidah Islamiyah','ISC102':'Ulum Al-Quran','ISH101':'Halal Consumerism','LCC111':'English I','MAT112':'Business Math',
'CSC134':'Computer Info','CTU152':'Values & Civilization','ISC101':'Akhlaq','ISC152':'Ulum Hadith','ISC200':'Tarikh Tasyri','ISH150':'Food Science',
'CTU263':'Islam & Management','IMU202':'Islamic Economics','ISC151':'Usul Fiqh','ISH202':'Halal Business','ISH203':'Purification','LCC113':'English III',
'ENT300':'Entrepreneurship','IMU102':'Fiqh Muamalat','ISC201':'Qawaid Fiqhiyah','ISH250':'Fiqh Muasarah','ISH252':'Halal Standard','ISH253':'Halal Logistics',
'ISC251':'Dirasah Nassiyah','ISH301':'Halal Slaughtering','ISH304':'Halal Regulatory','ISH305':'Quality Assurance','ISH306':'Industrial Training'
};
let tahapAktif='Sem 3'; let subjekAktif='ISH202'; let tabAktif='buku';

function editNama(){
 const n=prompt("Nama VIP:",document.getElementById('namaVIP').innerText);
 if(n) document.getElementById('namaVIP').innerText=n;
}
function showTab(t){
 tabAktif=t;
 document.getElementById('viewBuku').classList.toggle('hidden',t!=='buku');
 document.getElementById('viewChat').classList.toggle('hidden',t!=='chat');
 document.getElementById('btnBuku').classList.toggle('active',t==='buku');
 document.getElementById('btnChat').classList.toggle('active',t==='chat');
 if(t==='chat') document.getElementById('subjekChat').innerText=subjekAktif;
}
function renderTahap(){
 const grid=document.getElementById('tahapGrid'); grid.innerHTML='';
 Object.keys(dataSemester).forEach(s=>{
  const btn=document.createElement('button');
  btn.className='tahun-btn'+(s===tahapAktif?' active':'');
  btn.innerText='🎒 '+s;
  btn.onclick=()=>{tahapAktif=s; subjekAktif=dataSemester[s][0]; renderTahap(); renderSubjek(); bukaBukuTeks();};
  grid.appendChild(btn);
 });
}
function renderSubjek(){
 const grid=document.getElementById('subjekGrid'); grid.innerHTML='';
 const colors=['biru','pink','kuning','hijau'];
 const icons=['📘','📗','📕','📙','💼','🧪'];
 dataSemester[tahapAktif].forEach((kod,i)=>{
  const box=document.createElement('div');
  box.className='subjek-box '+colors[i%4]+(kod===subjekAktif?' active':'');
  box.innerHTML=`<div class="subjek-icon">${icons[i%6]}</div><div class="subjek-nama">${kod}</div><div class="subjek-desc">${subjekFull[kod]||''}</div>`;
  box.onclick=()=>{subjekAktif=kod; renderSubjek(); bukaBukuTeks(); if(tabAktif==='chat') document.getElementById('subjekChat').innerText=kod;};
  grid.appendChild(box);
 });
}
async function bukaBukuTeks(){
 showTab('buku');
 const box=document.getElementById('viewBuku');
 box.innerHTML='⏳ Menjana buku teks untuk <b>'+subjekAktif+'</b>...';
 try{
  const res=await fetch('/api/buku-teks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subjek:subjekAktif,tahap:tahapAktif})});
  const result=await res.json();
  if(result.status==='success'){
    const d=result.data;
    box.innerHTML=`<h3 style="color:#f8d56b;margin-bottom:8px;font-size:14px">${d.tajuk}</h3><p style="white-space:pre-line">${d.kandungan}</p><div style="margin-top:14px;padding:10px;background:rgba(212,160,23,0.1);border-radius:10px;border-left:3px solid #d4a017"><b style="color:#f8d56b;font-size:11px">✍️ ${d.latihan.soalan}</b><div style="margin-top:8px">${d.latihan.pilihan.map((p,i)=>`<button onclick="if(${i}===${d.latihan.jawapan_betul}){this.style.background='#10b981'}else{this.style.background='#ef4444'};this.style.color='#fff'" style="display:block;width:100%;text-align:left;padding:8px;margin:4px 0;border-radius:8px;border:1px solid #2a4a7a;background:#0a1e3d;color:#fff;cursor:pointer;font-size:11px">${p}</button>`).join('')}</div><div style="margin-top:6px;font-size:10px;color:#94a3b8">${d.latihan.penjelasan}</div></div>`;
  } else box.innerHTML='❌ Gagal: '+(result.message||'');
 } catch(e){box.innerHTML='❌ Ralat sambungan: '+e.message;}
}
async function tanya(){
 const input=document.getElementById('soalan'); const q=input.value.trim(); if(!q) return;
 const box=document.getElementById('chatBox'); box.innerHTML+=`<div class="msg user">${q}</div>`; input.value=''; box.innerHTML+=`<div class="msg ai" id="load">⏳ berfikir...</div>`; box.scrollTop=box.scrollHeight;
 try{
  const res=await fetch('/api/tanya',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({soalan:q,subjek:subjekAktif,tahap:tahapAktif})});
  const data=await res.json(); document.getElementById('load')?.remove();
  box.innerHTML+=`<div class="msg ai">${(data.jawapan||'Maaf cuba lagi').replace(/\n/g,'<br>')}</div>`; box.scrollTop=box.scrollHeight;
 } catch(e){document.getElementById('load')?.remove(); box.innerHTML+=`<div class="msg ai">❌ Ralat</div>`;}
}
renderTahap(); renderSubjek(); bukaBukuTeks();
</script>
</body>
</html>
